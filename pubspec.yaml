name: flutter_application_1
description: "A Daily Expense Diary application for students."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0 
  fl_chart: ^0.66.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  crypto: ^3.0.7
  sembast: ^3.7.3
  sembast_web: ^2.3.0
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  shared_preferences: ^2.5.4
  file_picker: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  crop_your_image: ^1.1.0
  supabase_flutter: ^2.14.1
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/user/
    - .env

